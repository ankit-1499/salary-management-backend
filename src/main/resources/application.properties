spring.application.name=salary-management-backend

# Database Configuration (MySQL default)
spring.datasource.url=jdbc:mysql://localhost:3306/acme_salary_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Performance Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Actuator Config
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Default HR Security Credentials
app.security.hr.username=hr_admin
app.security.hr.password=hr_secret_123
